name: iOS TestFlight Build & Upload

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'

jobs:
  build_and_upload:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump Build Number
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Runs on every push to mobile/**, same trigger as android_build.yml, so both
          # can race to push a bump commit at once. Retry against the current origin/main
          # each time rather than rebasing, since actions/checkout is a shallow clone.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            CURRENT=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
            BUILD_NUMBER=$((CURRENT + 1))
            # BSD sed (macOS) requires the empty backup-suffix arg; see android_build.yml
            # for the GNU sed form used on ubuntu-latest.
            sed -i '' -E "s/^(version: [0-9]+\.[0-9]+\.[0-9]+\+)[0-9]+/\1${BUILD_NUMBER}/" pubspec.yaml

            git add pubspec.yaml
            git commit -m "ci: bump mobile build number to $BUILD_NUMBER [skip ci]"

            if git push origin HEAD:main; then
              echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
              echo "Bumped build number: $CURRENT -> $BUILD_NUMBER"
              break
            fi

            echo "Push race on attempt $attempt (android_build.yml likely bumped first) — retrying..."
            sleep $((RANDOM % 5 + 1))
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push build number bump after 5 attempts"
              exit 1
            fi
          done

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & test
        run: |
          flutter analyze
          flutter test

      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Configure Manual Signing and Build
        run: |
          echo "CODE_SIGN_STYLE=Manual" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER=Daily Grocer Distribution Profile" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=Apple Distribution" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=92HDZ2VQ5P" >> ios/Flutter/Release.xcconfig
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --build-number=$BUILD_NUMBER

      - name: Upload app to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file "build/ios/ipa/dailygrocer_mobile.ipa" --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
