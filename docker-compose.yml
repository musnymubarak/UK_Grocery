version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: daily_grocer_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set — see .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: daily_grocer_redis
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily_grocer_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set — see .env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set — see .env.example}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set — see .env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set — see .env.example}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set — see .env.example}
      - DEBUG=${DEBUG:-False}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-False}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,nginx}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      - postgres_backups:/app/backups
    depends_on:
      - db
      - redis
    networks:
      - app-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily_grocer_celery_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set — see .env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set — see .env.example}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set — see .env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set — see .env.example}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set — see .env.example}
      - DEBUG=${DEBUG:-False}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      - postgres_backups:/app/backups
    depends_on:
      - db
      - redis
    networks:
      - app-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily_grocer_celery_beat
    restart: always
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set — see .env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set — see .env.example}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:?POSTGRES_USER must be set — see .env.example}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/${POSTGRES_DB:?POSTGRES_DB must be set — see .env.example}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set — see .env.example}
      - DEBUG=${DEBUG:-False}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - db
      - redis
    networks:
      - app-network

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: daily_grocer_storefront
    restart: always
    networks:
      - app-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: daily_grocer_admin
    restart: always
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: daily_grocer_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/uploads:/data/uploads:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - storefront
      - admin
    networks:
      - app-network

volumes:
  postgres_data:
  postgres_backups:



networks:
  app-network:
    driver: bridge
