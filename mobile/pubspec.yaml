name: dailygrocer_mobile
description: Daily Grocer — premium mobile storefront.
publish_to: 'none'
version: 1.0.0+51

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  dio: ^5.7.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  sign_in_with_apple: ^6.1.2
  google_sign_in: ^6.2.1
  flutter_stripe: ^11.4.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1


dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/categories/
    # google_fonts resolves bundled assets before hitting the network, matching
    # any asset whose filename ends with the API prefix (HankenGrotesk-Bold,
    # HankenGrotesk-ExtraBold). No `fonts:` declaration is needed and
    # AppTypography keeps calling GoogleFonts.hankenGrotesk() unchanged.
    # Without this the splash wordmark renders in a fallback font on a cold
    # first launch and then swaps once the download lands.
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/app_logo.png"
    icon_size: 48
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_background_dark: "#050922"
  adaptive_icon_foreground: "assets/app_logo.png"
  image_path_ios_dark_transparent: "assets/app_logo.png"
  min_sdk_android: 21
